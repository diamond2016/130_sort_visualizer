<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sort Visualizer</title>
  </head>

  <body>
    <div id="app">
      <!-- The entire App -->
    
    <header>
      <h1>Sort Visualizer</h1>
    </header>

     <!-- Selection algorithm & cmd buttons, visualization -->
    <main>

      <!-- Sort Algorithm -->
      <section id="algo">
        <h3>Select Sort Algorithm</h3>
        <nav>
          <label for="algo-select">Algorithm:</label>
          <select id="algo-select">
            <option value="bubble">Bubble Sort</option>
            <option value="insertion">Insertion Sort</option>
            <option value="selection">Selection Sort</option>
            <option value="merge">Merge Sort</option>
            <option value="quick">Quick Sort</option>
            <option value="heap">Heap Sort</option>
            <option value="shell">Shell Sort</option>
            <option value="radix">Radix Sort</option>
          </select>
        </nav>
      </section>

    <!-- Playback Controls -->
    <section id="playback-controls">
      <h3>Manage Visualization</h3>
      <nav>
        <button type="button" @click="start">Start</button>
        <button type="button" @click="stop">Stop</button>
        <button type="button" @click="step">Step</button>
        <button type="button" @click="resume">Reset</button>
      </nav>
    </section>


    <!-- The actual visualization area -->
    <section id="visualization-area">
      <figure>
        <canvas ref="canvas"></canvas>
        <figcaption>Visualizing current array state</figcaption>
      </figure>
    </section>
  </main>

  <!-- The Statistics Sidebar -->
  <aside id="stats-panel">
    <section>
      <h3>Statistics</h3>
      <p>Comparisons: <span id="comp-count">0</span></p>
      <p>Swaps: <span id="swap-count">0</span></p>
    </section>
  </aside>

 <!-- The Visualization Controls Sidebar -->
  <aside id="visualization-panel">
    <section class="visualization-controls">
      <h3>Visualization Speed Controls</h3>
      <label for="display">Display</label>
      <select id="display" v-model="selectedDisplay">
        <option value="bars">Bars</option>
        <option value="other">Other</option>
      </select>
      <label for="order">Sample Order</label>
      <select id="display" v-model="selectedOrder">
        <option value="random">Random</option>
        <option value="increasing">Increasing Order</option>
        <option value="decreasing">Decreasing Order</option>
      </select>
      <label for="sample-size">Sample Size</label>
        <input type="range" id="sample-size" min="10" max="100">
        <section id="speed-controls">
          <h4>Speed</h4>
          <label for="slow">Slow:</label>
          <input type="radio" id="slow" name="visualizaton-speed" value="slow">
          <label for="medium">Medium:</label>
          <input type="radio" id="medium" name="visualizaton-speed" value="medium">
          <label for="fast">Fast:</label>
          <input type="radio" id="fast" name="visualizaton-speed" value="fast">
        </section>
      <label for="delay">Delay per step (ms)</label>
        <input type="number" id="delay" min="100" max="1000">
    </section>
  </aside>

  <footer>
      <p>Status: Ready</p>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>

  </body>
</html>
